<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 아이폰 화면 폭에 맞추고, 노치(화면 위 홈) 부분까지 화면을 씁니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <title>영어 말하기 연습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- sentences.json을 못 읽었을 때 이유를 보여주는 상자 -->
    <p id="error" class="error" hidden></p>

    <!-- ===== 홈 화면 ===== -->
    <section id="home" class="screen">
      <header class="home-header">
        <p class="date" id="today-date"></p>
        <h1>영어 말하기 연습</h1>
      </header>

      <div class="streak">
        <span class="streak-number" id="streak-count">0</span>
        <span class="streak-label">일 연속</span>
      </div>

      <p class="topic">
        <span class="topic-label">오늘의 주제</span>
        <strong id="today-topic">불러오는 중…</strong>
        <span class="topic-set" id="today-set"></span>
      </p>

      <nav class="modes">
        <a class="mode-button mode-3" href="#three">
          <span class="mode-title">3분 모드</span>
          <span class="mode-desc">오늘 문장 5개 듣고 따라 말하기</span>
        </a>
        <a class="mode-button mode-25" href="#twentyfive">
          <span class="mode-title">25분 모드</span>
          <span class="mode-desc">복습 → 따라 말하기 → Claude 롤플레이</span>
        </a>
      </nav>
    </section>

    <!-- ===== 3분 모드 ===== -->
    <section id="three" class="screen" hidden>
      <a class="back" href="#">← 홈</a>
      <h2>3분 모드</h2>
      <p class="mode-topic" id="three-topic"></p>

      <div class="progress">
        <div class="progress-bar"><span id="three-bar"></span></div>
        <span class="progress-text" id="three-count">0/5</span>
      </div>
      <p class="how">듣기 → 소리 내서 따라 말하기 → "말했어요"</p>

      <!-- 문장 카드가 여기에 들어갑니다 (아래 card-template을 복사해서 만듦) -->
      <div id="three-cards" class="cards"></div>

      <div id="three-done" class="done" hidden>
        <p class="done-title">잘했어요! 오늘 문장을 다 말했어요.</p>
        <a class="btn btn-primary" href="#">홈으로</a>
      </div>

      <p class="sound-tip">소리가 안 나면 아이폰의 무음 모드와 볼륨을 확인해 주세요.</p>
    </section>

    <!-- 문장 카드 1장의 모양 -->
    <template id="card-template">
      <article class="card">
        <p class="card-num"></p>
        <p class="card-en" lang="en"></p>
        <p class="card-ko"></p>
        <p class="card-hint">이제 소리 내서 따라 말해 보세요</p>
        <div class="card-actions">
          <button type="button" class="btn btn-listen">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
              <path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="label">듣기</span>
          </button>
          <button type="button" class="btn btn-said" aria-pressed="false">말했어요</button>
        </div>
      </article>
    </template>

    <!-- ===== 25분 모드 (3단계에서 채웁니다) ===== -->
    <section id="twentyfive" class="screen" hidden>
      <a class="back" href="#">← 홈</a>
      <h2>25분 모드</h2>
      <p class="placeholder">3단계에서 만들어요.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
